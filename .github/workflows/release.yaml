name: GUI Release

on:
  # We only run manually
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
          - alpha
          - beta
          - stable
        default: alpha

concurrency:
  group: release # only 1 release at a time

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clean out files part 1
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - uses: actions/checkout@v4

      - name: Clean out files part 2
        run: |
          rm -rf .git
          echo "Free Space"
          df -h

      - name: env - better defaulting of env vars;
        id: env
        run: |
            RELEASE_REPO="${{ secrets.RELEASE_REPO }}"
            if [[ -z "$RELEASE_REPO" ]]; then
              RELEASE_REPO="PortMaster-GUI"
            fi
            echo "RELEASE_REPO=$RELEASE_REPO" >> $GITHUB_OUTPUT

            RELEASE_ORG="${{ secrets.RELEASE_ORG }}"
            if [[ -z "$RELEASE_ORG" ]]; then
              RELEASE_ORG="PortsMaster"
            fi
            echo "RELEASE_ORG=$RELEASE_ORG" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - uses: edgarrc/action-7z@v1

      # The current version.json, do_release.sh updates this channel's entry in it.
      - uses: robinraju/release-downloader@v1.8
        with:
          repository: ${{ github.repository }}
          latest: true
          fileName: "*.json"

      # Only stable builds installers, the others carry the latest ones along.
      - uses: robinraju/release-downloader@v1.8
        if: ${{ inputs.channel != 'stable' }}
        with:
          repository: ${{ github.repository }}
          latest: true
          fileName: "Install*PortMaster.sh"
          out-file-path: dist

      - name: Get release name for artifacts
        id: version
        run: |
            echo "version=$(date -u +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
            echo "release=${{ inputs.channel }}" >> $GITHUB_OUTPUT

      - name: Create PortMaster.zip
        id: create-zip
        run: |
          ./do_release.sh "${{steps.version.outputs.release}}" "${{steps.version.outputs.version}}"

          # The CFW bundles are what CFWs put in their images: always made from stable.
          if [[ "${{steps.version.outputs.release}}" == "stable" ]]; then
            BUNDLE_FROM=""
          else
            BUNDLE_FROM="stable"
          fi

          ./do_muos_release.sh $BUNDLE_FROM
          ./do_trimui_release.sh $BUNDLE_FROM
          ./do_x86_64_release.sh $BUNDLE_FROM

      - name: Create md5 hashes
        id: md5
        run: |
            cd dist
            for file in *.zip; do
              if [ ! -f "$file" ]; then
                continue
              fi
              echo "file: $file"
              md5sum "$file" | cut -f1 -d' ' > "$file.md5"
            done

      - name: "Prepare Release"
        uses: ncipollo/release-action@v1
        with:
          tag: "${{steps.version.outputs.version}}"
          allowUpdates: true
          draft: true
          prerelease: false
          replacesArtifacts: false
          omitNameDuringUpdate: true
          body: "Release: ${{steps.version.outputs.version}} (${{steps.version.outputs.release}})"
          artifacts: "dist/PortMaster.zip, dist/PortMaster.zip.md5, dist/version, dist/version.json, dist/Install*PortMaster.sh, dist/muos.portmaster.zip, dist/muos.portmaster.zip.md5, dist/retrodeck.portmaster.zip, dist/retrodeck.portmaster.zip.md5, dist/trimui.portmaster.zip, dist/trimui.portmaster.zip.md5"
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ steps.env.outputs.RELEASE_REPO }}
          owner: ${{ steps.env.outputs.RELEASE_ORG }}

      - name: "Publish Release"
        uses: ncipollo/release-action@v1
        with:
          tag: "${{steps.version.outputs.version}}"
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          allowUpdates: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ steps.env.outputs.RELEASE_REPO}}
          owner: ${{ steps.env.outputs.RELEASE_ORG}}

      - name: Release Info
        id: info
        run: |
          echo "Published release: ${{steps.version.outputs.version}} (${{steps.version.outputs.release}}) to: https://github.com/${{ steps.env.outputs.RELEASE_ORG}}/${{ steps.env.outputs.RELEASE_REPO}}"
